name: Build BoxGo APK

on:
  push:
    branches: [ frontend ]
  pull_request:
    branches: [ frontend ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.1'
        channel: 'stable'

    - name: Auto-fix Gradle Configuration
      run: |
        echo "🔧 AUTO-FIXING GRADLE CONFIGURATION..."
        
        # 1. Fix settings.gradle
        echo "📝 Updating android/settings.gradle..."
        sed -i 's/"com.android.application" version "8\.[0-9]\.[0-9]"/"com.android.application" version "8.4.0"/g' android/settings.gradle
        sed -i 's/"org.jetbrains.kotlin.android" version "1\.[0-9]\.[0-9]*"/"org.jetbrains.kotlin.android" version "1.9.23"/g' android/settings.gradle
        
        # 2. Create build.gradle dengan heredoc yang benar
        echo "📝 Creating android/build.gradle..."
        cat > android/build.gradle << "ENDOFFILE"
buildscript {
    ext.kotlin_version = '1.9.23'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
ENDOFFILE

        # 3. Update app/build.gradle
        if [ -f "android/app/build.gradle" ]; then
          echo "📝 Updating android/app/build.gradle..."
          sed -i 's/compileSdk [0-9]*/compileSdk 34/g' android/app/build.gradle
          sed -i 's/targetSdk [0-9]*/targetSdk 34/g' android/app/build.gradle
          sed -i 's/minSdk [0-9]*/minSdk 21/g' android/app/build.gradle
        fi

        echo "✅ AUTO-FIX COMPLETED!"

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK (Release)
      run: flutter build apk --release --verbose

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: boxgo-app-release
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
