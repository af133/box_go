name: Build BoxGo APK

on:
  push:
    branches: [ frontend ]
  pull_request:
    branches: [ frontend ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.1'
        channel: 'stable'

    - name: Fix Missing Buildscript
      run: |
        echo "🔄 Adding missing buildscript to android/build.gradle..."
        
        # Backup original file
        cp android/build.gradle android/build.gradle.backup
        
        # Create new file with buildscript
        cat > android/build.gradle << 'EOF'
buildscript {
    ext.kotlin_version = '1.9.23'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
EOF
        
        echo "✅ Buildscript added to android/build.gradle"

    - name: Verify Fixed Configuration
      run: |
        echo "📊 Updated android/build.gradle:"
        cat android/build.gradle
        echo "📊 Gradle wrapper:"
        cat android/gradle/wrapper/gradle-wrapper.properties

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK (Release)
      run: flutter build apk --release --verbose

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: boxgo-app-release
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
