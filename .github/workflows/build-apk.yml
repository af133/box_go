name: Build BoxGo APK

on:
  push:
    branches: [ frontend ]
  pull_request:
    branches: [ frontend ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.1'
        channel: 'stable'

    - name: Upgrade Gradle Wrapper (minimum compatible)
      working-directory: android
      run: |
        ./gradlew wrapper --gradle-version 8.10.2 --distribution-type all

    - name: Fix SDK versions if needed
      run: |
        if [ -f "android/app/build.gradle" ]; then
          sed -i 's/compileSdk [0-9]*/compileSdk 34/g' android/app/build.gradle
          sed -i 's/targetSdk [0-9]*/targetSdk 34/g' android/app/build.gradle
          sed -i 's/minSdk [0-9]*/minSdk 21/g' android/app/build.gradle
        fi

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK (Release)
      run: flutter build apk --release

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: boxgo-app-release
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30

    - name: Build Success Notification
      if: success()
      run: echo "🎉 APK successfully built and uploaded!"
